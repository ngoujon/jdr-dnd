server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 30m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Pas d'index Google : pas de nom de domaine, l'outil est prive.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  # Rien a la racine : l'application vit sous /jdr/. Page blanche, pas d'erreur.
  location = / {
    default_type text/html;
    return 200 '';
  }

  location = /jdr {
    return 301 /jdr/;
  }

  # Application monopage servie sous /jdr/ : toute route inconnue renvoie index.html.
  # Aucune mise en cache, pas meme sur les assets fingerprintes : un joueur qui
  # revient doit toujours tomber sur la version qui vient d'etre deployee, sans
  # avoir a vider son cache ni forcer un rechargement.
  # nginx n'herite pas des add_header du bloc serveur des qu'un bloc en declare
  # un : le X-Robots-Tag doit donc etre repete ici.
  location /jdr/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /jdr/index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  # Bloc distinct pour qu'un asset absent renvoie une 404 au lieu de l'index.html.
  location /jdr/assets/ {
    alias /usr/share/nginx/html/assets/;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location /jdr/api/ {
    proxy_pass http://server:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Temps reel : WebSocket avec repli long-polling.
  location /jdr/socket.io/ {
    proxy_pass http://server:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Les URLs de fichiers (televerses ou fournis) sont enregistrees en base sans
  # prefixe : on les sert donc aussi a la racine, en plus de /jdr/.
  location /uploads/ { proxy_pass http://server:4000; }
  location /builtin/ { proxy_pass http://server:4000; }
}
